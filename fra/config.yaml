# Feature-Resolved Attention Configuration

model:
  name: "gemma-2-2b"  # TransformerLens model name
  device: "cuda"  # or "cpu"

sae:
  type: "gemma"  # one of: hub, gemma, local_ln1, legacy_repo
  release: "gemma-scope-2b-pt-res"
  sae_id_template: "layer_{layer}/width_16k/average_l0_82"
  layer: 12  # Gemma-2-2B layer index
  hook_point: "hook_resid_pre"  # FRA activation hook for Gemma-Scope residual SAEs
  normalize_activations: false

dataset:
  name: "Skylion007/openwebtext"
  split: "train"
  max_samples: 1000  # Number of samples to load for quick testing
  max_length: 128  # Maximum sequence length

experiment:
  batch_size: 8
  seed: 42
  output_dir: "outputs"
  
# Feature-Resolved Attention specific settings
fra:
  top_k_features: 10  # Number of top features to analyze per position
  sparse_threshold: 0.01  # Threshold for considering a feature "active"