# LN1 variant: same benchmark as recreate/ but the 4 TopK SAEs attach to
# blocks.{i}.ln1.hook_normalized (post-LN, pre-attention) instead of
# blocks.{i}.hook_resid_post. MLC and TXC are NOT trained here.
#
# Run with:  python reproduce.py config.yaml    (local)
#       or:  ./reproduce.sh                     (remote A40 + pull results)

env:
  base_model: "roneneldan/TinyStories-Instruct-33M"
  sleeper_model: "mars-jason-25/tiny-stories-33M-TSdata-sleeper"
  dataset: "mars-jason-25/tiny_stories_instruct_sleeper_data"
  device: null

# Cache residual activations at these hookpoints. 4 hooks, 1 per layer.
hook_names:
  - blocks.0.ln1.hook_normalized
  - blocks.1.ln1.hook_normalized
  - blocks.2.ln1.hook_normalized
  - blocks.3.ln1.hook_normalized

# Which architectures to train + evaluate.
archs:
  - sae_layer0
  - sae_layer1
  - sae_layer2
  - sae_layer3

# Map SAE tags to the hookpoint each one reads from.
sae_layer_hooks_override:
  sae_layer0: blocks.0.ln1.hook_normalized
  sae_layer1: blocks.1.ln1.hook_normalized
  sae_layer2: blocks.2.ln1.hook_normalized
  sae_layer3: blocks.3.ln1.hook_normalized

harvest:
  n_train: 10000
  n_val: 200
  n_test: 200
  seq_len: 128
  chunk_size: 32
  seed: 0

train:
  d_sae: 1536
  k_total: 32
  T: 30                  # unused (no TXC) but harmless
  n_steps: 4000
  batch_size: 4096
  lr: 5.0e-4
  normalize_every: 100
  print_every: 200
  seed: 0

sweep:
  top_k: 100
  stage2_keep: 10
  alphas: [0.25, 0.5, 1.0, 1.5, 2.0]
  delta_util: 0.05
  gen_tokens: 16
  encode_chunk_size: 256

paths:
  data_dir: outputs/data
  plots_dir: outputs/plots
