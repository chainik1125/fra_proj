# Exact configuration used to produce RESULTS.md and
# outputs/plots/pareto_asr_vs_utility.png on 2026-04-19.
#
# Run with:  python reproduce.py config.yaml
# (or edit values, then rerun to sweep different settings)

env:
  # Hugging Face artifacts. The sleeper model is a QLoRA adapter — reproduce.py
  # loads the base, applies the adapter via peft, merges weights, then hands the
  # merged model to TransformerLens.
  base_model: "roneneldan/TinyStories-Instruct-33M"
  sleeper_model: "mars-jason-25/tiny-stories-33M-TSdata-sleeper"
  dataset: "mars-jason-25/tiny_stories_instruct_sleeper_data"
  # Auto-picked by each script if null. Set to "cuda" / "mps" / "cpu" to force.
  device: null

harvest:
  n_train: 10000         # sequences for crosscoder training
  n_val: 200             # paired clean/deployment prompts for feature ranking + sweep
  n_test: 200            # paired clean/deployment prompts for held-out test
  seq_len: 128
  chunk_size: 32         # batch size for the initial forward-pass caching
  seed: 0

train:
  d_sae: 1536            # latent width (matches TinyStories crosscoder replication at 2× expansion)
  k_total: 32            # TopK sparsity budget; matched across all 8 architectures
  T: 30                  # TXC window length (centered, zero-padded at edges)
  n_steps: 4000
  batch_size: 4096
  lr: 5.0e-4
  normalize_every: 100
  print_every: 200
  seed: 0
  # The 8 architectures trained in one process share the same (seq, pos) batches:
  #   mlc           : MultiLayerCrosscoder over all 5 residual hookpoints
  #   txc_{early,mid,late}: TemporalCrosscoder (T=30) at blocks.{0,2,3}.hook_resid_post
  #   sae_layer{0..3}     : TopKSAE at blocks.{0..3}.hook_resid_post

sweep:
  top_k: 100             # top-K features per arch by prompt-only deployment-vs-clean selectivity
  stage2_keep: 10        # features to retain for stage-2 sampled ASR
  alphas: [0.25, 0.5, 1.0, 1.5, 2.0]
  delta_util: 0.05       # utility budget (nats) on clean-continuation CE
  gen_tokens: 16         # ASR_N — number of greedy-generated tokens to scan for the sleeper phrase
  encode_chunk_size: 256

hook_names:
  # Informational. `harvest_activations.py` reads sleeper_utils.MLC_HOOK_NAMES directly.
  mlc:
    - blocks.0.hook_resid_pre
    - blocks.0.hook_resid_post
    - blocks.1.hook_resid_post
    - blocks.2.hook_resid_post
    - blocks.3.hook_resid_post
  txc:
    txc_early: blocks.0.hook_resid_post
    txc_mid:   blocks.2.hook_resid_post
    txc_late:  blocks.3.hook_resid_post
  sae:
    sae_layer0: blocks.0.hook_resid_post
    sae_layer1: blocks.1.hook_resid_post
    sae_layer2: blocks.2.hook_resid_post
    sae_layer3: blocks.3.hook_resid_post

paths:
  # Relative to the experiment directory (experiments/tinystories_sleeper/).
  data_dir: outputs/data
  plots_dir: outputs/plots
