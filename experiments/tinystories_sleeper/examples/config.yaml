# Dashboard config for SAE-layer-0 feature 831.
#
# CLI flags on dashboard_sae_layer0_f831.py override any values set here.

feature:
  idx: 831
  layer_hook: blocks.0.hook_resid_post
  alpha: 1.5          # α* selected on the val set

n_examples: 5
gen_tokens: 40
prompt_selection_seed: 0       # picks which val clean prompts to use

# Default: stochastic sampling (temperature-scaled nucleus).
# This is how TinyStories is actually sampled in practice.
sampling:
  mode: sample
  temperature: 0.8
  top_p: 0.9
  seed: 0                      # sampling RNG seed (for reproducibility)

# Alternative: greedy (deterministic argmax) sampling.
# Uncomment the block below and comment out the sampling block above to use it.
# Useful when you want bit-for-bit reproducibility or to compute ASR-style
# metrics that must not be perturbed by sampling noise.
# sampling:
#   mode: greedy
