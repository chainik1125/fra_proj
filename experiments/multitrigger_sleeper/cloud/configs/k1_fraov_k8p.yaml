# FRA-OV, fresh K1 ln1@L0 SAE trained at the SAME budget as sae_ln1_K8 (1500 rows, 4000 steps)
model: K1
eval:   {per_trigger: 24, n_new: 16, n_eval_rows: 600, eval_skip: 20000, max_prompt: 64}
source:
  kind: sae
  read_hook: blocks.0.ln1.hook_normalized
  sae:  {load: train, train_on: base, d_sae: 2048, k: 32, steps: 4000, harvest_rows: 1500}
rank:      {method: ov_diff, target: ihy_onset}
intervene: {route: ov, footprint: trigger, select: topk, topk: 24}
sweep:     {coeffs: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0], topk_list: [8, 16, 24]}
