[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temp-xc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fra",
    "tiny-sleepers",
    "dotenv>=0.9.9",
    "numpy>=1.26,<2",
    "sae-lens>=6.37.4",
    "torch>=2.10.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fra_sleeper*"]

[tool.uv.sources]
fra = { path = "./fra", editable = true }
tiny-sleepers = { path = "./tiny-sleepers", editable = true }
