[project]
name = "temp-xc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dictionary-learning @ git+https://github.com/jkminder/dictionary_learning",
    "eindex",
    "ipython",
    "matplotlib",
    "pydantic",
    "sae-lens",
    "scipy",
    "streamlit",
]

[project.scripts]
dashboard = "fra.dashboard.run:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fra*"]

[dependency-groups]
dev = [
    "pytest",
]
