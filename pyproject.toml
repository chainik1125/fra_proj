[project]
name = "sleeper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "transformer-lens>=2.18.0",
    "transformers>=4.43,<5",
    "datasets>=2.14",
    "peft>=0.10",
    "tqdm",
    "matplotlib>=3.8",
    "sae-lens>=6.44",
]

[tool.setuptools.packages.find]
include = ["sleeper", "scripts"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
