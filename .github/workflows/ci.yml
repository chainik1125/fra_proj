name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest "numpy<2" matplotlib datasets torch pyyaml einops

      - name: Run tests
        run: PYTHONPATH=src pytest tests/test_fra_sleeper_multi_layer.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v20.0.0
        with:
          globs: |
            docs/**/*.md
            !docs/.obsidian/**

      - name: Run tag check
        run: ./check-tags.sh
